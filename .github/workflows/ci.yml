name: 🟠 Orange Belt CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-soroban-contracts:
    name: Build & Test Soroban Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Run Inter-Contract Soroban Unit Tests
        run: |
          cd soroban_vault_protocol
          cargo test --verbose

      - name: Compile Wasm Target
        run: |
          cd soroban_vault_protocol
          cargo build --target wasm32v1-none --release

  test-frontend:
    name: Verify Frontend Build & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Production Build
        run: npm run build
